<div class="border-b border-theme-tertiary py-4 px-4 flex items-center justify-between">
  <h1 class="text-2xl md:text-3xl font-bold text-theme-primary-text">
    {{ isPreviewMode() ? 'Blog Preview' : 'Blog Editor' }}
  </h1>
  @if (isPreviewMode()) {
    <button
      (click)="onBack()"
      class="bg-accent hover:bg-accent-muted active:bg-accent text-white font-semibold py-2 px-4 rounded flex items-center gap-2 transition-colors cursor-pointer"
      aria-label="Return to blog list"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span>Back</span>
    </button>
  } @else {
    <button
      (click)="onAdd()"
      class="bg-accent hover:bg-accent-muted active:bg-accent text-white font-semibold py-2 px-4 rounded flex items-center gap-2 transition-colors cursor-pointer"
      aria-label="Add new blog"
    >
      <i class="fa-solid fa-plus"></i>
      <span>Add</span>
    </button>
  }
</div>
