<!-- blog-editor-form.component.html -->
<form [formGroup]="blogForm" (ngSubmit)="onSubmit()" class="w-full">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="header" class="block text-sm font-medium text-theme-primary-text mb-2">
        Header <span class="text-red-500">*</span>
      </label>
      <input
        id="header"
        type="text"
        formControlName="header"
        autocomplete="off"
        class="w-full px-3 py-2 text-sm rounded-lg border !bg-theme-secondary text-theme-primary-text placeholder:text-theme-secondary-text focus:outline-none focus:ring-2 focus:ring-accent transition-all"
        [class.border-red-500]="isFieldInvalid('header')"
        [class.border-theme-tertiary]="!isFieldInvalid('header')"
        placeholder="Enter header"
      />
      <p *ngIf="isFieldInvalid('header')" class="mt-1 text-sm text-red-500">
        {{ getErrorMessage('header') }}
      </p>
    </div>

    <div>
      <label for="subHeader" class="block text-sm font-medium text-theme-primary-text mb-2">
        Subheader <span class="text-red-500">*</span>
      </label>
      <input
        id="subHeader"
        type="text"
        formControlName="subHeader"
        autocomplete="off"
        class="w-full px-3 py-2 text-sm rounded-lg border !bg-theme-secondary text-theme-primary-text placeholder:text-theme-secondary-text focus:outline-none focus:ring-2 focus:ring-accent transition-all"
        [class.border-red-500]="isFieldInvalid('subHeader')"
        [class.border-theme-tertiary]="!isFieldInvalid('subHeader')"
        placeholder="Enter subheader"
      />
      <p *ngIf="isFieldInvalid('subHeader')" class="mt-1 text-sm text-red-500">
        {{ getErrorMessage('subHeader') }}
      </p>
    </div>

    <div class="md:col-span-2">
      <label for="author" class="block text-sm font-medium text-theme-primary-text mb-2">
        Author <span class="text-red-500">*</span>
      </label>
      <input
        id="author"
        type="text"
        formControlName="author"
        autocomplete="off"
        class="w-full px-3 py-2 text-sm rounded-lg border !bg-theme-secondary text-theme-primary-text placeholder:text-theme-secondary-text focus:outline-none focus:ring-2 focus:ring-accent transition-all"
        [class.border-red-500]="isFieldInvalid('author')"
        [class.border-theme-tertiary]="!isFieldInvalid('author')"
        placeholder="Enter author"
      />
      <p *ngIf="isFieldInvalid('author')" class="mt-1 text-sm text-red-500">
        {{ getErrorMessage('author') }}
      </p>
    </div>
  </div>

  <!-- Body Sections -->
  <div class="mt-8">
    <h3 class="text-lg font-medium text-theme-primary-text mb-4">Content Sections</h3>

    <!-- Existing body sections -->
    <div class="space-y-3">
      <app-blog-body-form
        *ngFor="let section of bodySections.controls; let i = index"
        [bodyFormGroup]="getBodySectionGroup(i)"
        [index]="i"
        [initiallyExpanded]="isSectionNewlyAdded(i)"
        (remove)="removeBodySection(i)"
      />
    </div>

    <!-- Add Section Button -->
    <button
      type="button"
      (click)="addBodySection()"
      class="w-full mt-3 px-4 py-3 text-sm border-2 border-dashed border-theme-tertiary text-theme-secondary-text rounded-lg hover:border-accent hover:text-accent hover:bg-accent/5 focus:outline-none focus:ring-2 focus:ring-accent transition-all cursor-pointer"
    >
      <span class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add Content Section
      </span>
    </button>
  </div>
</form>
