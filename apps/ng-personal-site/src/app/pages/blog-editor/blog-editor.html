<div class="w-full h-full bg-theme-primary p-3 sm:p-4 md:p-6 lg:p-9 overflow-hidden">
  <app-blog-editor-card (add)="openModal()" (edit)="openEditModal($event)"></app-blog-editor-card>
</div>

<app-modal [isOpen]="isModalOpen()" [title]="modalTitle" (close)="closeModal()">
  <app-blog-editor-form
    [initialData]="editingBlogData()"
    [isEditing]="isEditing"
    (formSubmit)="onFormSubmit($event)"
    (formCancel)="onFormCancel()"
  ></app-blog-editor-form>
</app-modal>
