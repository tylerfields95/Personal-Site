<div class="w-full h-full bg-theme-primary p-3 sm:p-4 md:p-6 lg:p-9 overflow-hidden">
  <app-blog-editor-card (add)="openModal()" (edit)="openEditModal($event)"></app-blog-editor-card>
</div>

<app-modal [isOpen]="isModalOpen()" [title]="modalTitle" (close)="closeModal()">
  <app-blog-editor-form
    #blogForm
    [initialData]="editingBlogData()"
    [isEditing]="isEditing"
    (formSubmit)="onFormSubmit($event)"
    (formCancel)="onFormCancel()"
  ></app-blog-editor-form>

  <div modal-footer class="flex gap-3 justify-end overflow-visible">
    @if (blogForm.hasChanges) {
      <app-confirmation-popover
        [message]="'Discard all changes?'"
        [confirmText]="'Discard'"
        [cancelText]="'Keep Editing'"
        [position]="PopoverPosition.Top"
        [variant]="PopoverVariant.Warning"
        (confirm)="blogForm.onCancel()"
      >
        <button
          type="button"
          class="px-4 py-2 text-sm border border-theme-tertiary text-theme-primary-text rounded-lg hover:bg-theme-secondary focus:outline-none focus:ring-2 focus:ring-theme-tertiary focus:ring-offset-2 transition-all cursor-pointer"
        >
          Cancel
        </button>
      </app-confirmation-popover>
    } @else {
      <button
        type="button"
        (click)="blogForm.onCancel()"
        class="px-4 py-2 text-sm border border-theme-tertiary text-theme-primary-text rounded-lg hover:bg-theme-secondary focus:outline-none focus:ring-2 focus:ring-theme-tertiary focus:ring-offset-2 transition-all cursor-pointer"
      >
        Cancel
      </button>
    }

    @if (blogForm.hasChanges) {
      <app-confirmation-popover
        [message]="'Reset all form fields?'"
        [confirmText]="'Reset'"
        [cancelText]="'Cancel'"
        [position]="PopoverPosition.Top"
        [variant]="PopoverVariant.Warning"
        (confirm)="blogForm.onReset()"
      >
        <button
          type="button"
          class="px-4 py-2 text-sm bg-theme-tertiary text-theme-primary-text rounded-lg hover:bg-theme-secondary focus:outline-none focus:ring-2 focus:ring-theme-tertiary focus:ring-offset-2 transition-all cursor-pointer"
        >
          Reset
        </button>
      </app-confirmation-popover>
    } @else {
      <button
        type="button"
        (click)="blogForm.onReset()"
        class="px-4 py-2 text-sm bg-theme-tertiary text-theme-primary-text rounded-lg hover:bg-theme-secondary focus:outline-none focus:ring-2 focus:ring-theme-tertiary focus:ring-offset-2 transition-all cursor-pointer"
      >
        Reset
      </button>
    }

    <button
      type="button"
      (click)="blogForm.onSubmit()"
      class="px-4 py-2 text-sm bg-accent text-white rounded-lg hover:bg-accent-muted focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-all cursor-pointer"
      [disabled]="!blogForm.blogForm.valid"
    >
      Save
    </button>
  </div>
</app-modal>
