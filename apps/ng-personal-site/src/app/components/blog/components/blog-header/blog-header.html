<div #blogHeader class="w-full flex flex-row justify-between items center">
  <div class="w-16 h-16 md:w-32 md:h-32"></div>
  <div class="flex flex-col items-center">
    <div class="text-2xl md:text-5xl pb-2 font-bold text-theme-primary-text">
      {{ blogData()?.header }}
    </div>
    <div class="text-xl md:text-2xl pb-2 text-theme-secondary-text">
      {{ blogData()?.subHeader }}
    </div>
    <div class="flex flex-row text-theme-secondary-text text-xs md:text-sm">
      <div class="mr-10">author: {{ blogData()?.author }}</div>
      <div>Publish Date: {{ blogData()?.createdOn | date : 'mediumDate' }}</div>
    </div>
  </div>
  <div class="w-16 h-16 md:w-32 md:h-32"></div>
</div>
