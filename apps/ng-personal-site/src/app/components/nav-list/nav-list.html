@for (r of routes(); track r.path) {
<div
  class="w-full flex justify-center bg-theme-secondary hover:bg-theme-tertiary active:bg-theme-quaternary text-theme-primary-text hover:cursor-pointer hover:text-accent active:text-accent text-2xl md:text-xl py-3 md:py-2"
  (click)="navigateToPath(r?.path)"
>
  {{ r?.data?.['label'] }}
</div>
}
